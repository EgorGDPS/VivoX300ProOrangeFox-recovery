name: Build OrangeFox Recovery for vivo X300 Pro

on:
  workflow_dispatch:
    inputs:
      MANIFEST_BRANCH:
        description: 'OrangeFox Manifest Branch'
        required: true
        default: 'fox_14.1'
        type: choice
        options:
          - fox_14.1
          - fox_12.1

jobs:
  build:
    name: Build OrangeFox
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Device Tree
        uses: actions/checkout@v4
        with:
          path: device_tree

      - name: Free Disk Space (Fast)
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL

      - name: Setup Build Environment & Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib \
            gcc-multilib git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev \
            lib32z1-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev \
            libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc \
            yasm zip zlib1g-dev python3 python3-pip

      - name: Install Google Repo Tool
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+rx ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Initialize OrangeFox Source Tree
        run: |
          mkdir -p ~/OrangeFox
          cd ~/OrangeFox
          git config --global user.name "Builder"
          git config --global user.email "builder@github.com"
          repo init -u https://gitlab.com/OrangeFox/manifest.git -b ${{ github.event.inputs.MANIFEST_BRANCH }} --depth=1
          repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

      - name: Setup vivo X300 Pro Device Tree
        run: |
          mkdir -p ~/OrangeFox/device/vivo
          cp -r $GITHUB_WORKSPACE/device_tree ~/OrangeFox/device/vivo/PD2502
          rm -rf ~/OrangeFox/device/vivo/PD2502/.github
          rm -rf ~/OrangeFox/device/vivo/PD2502/.git

      - name: Compile OrangeFox Recovery
        run: |
          cd ~/OrangeFox
          source build/envsetup.sh
          source device/vivo/PD2502/vendorsetup.sh
          lunch fox_PD2502-eng
          mka recoveryimage -j$(nproc --all)

      - name: Upload Output Recovery Images
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-vivo-x300pro-PD2502
          path: |
            ~/OrangeFox/out/target/product/PD2502/vendor_boot.img
            ~/OrangeFox/out/target/product/PD2502/OrangeFox-*.zip
