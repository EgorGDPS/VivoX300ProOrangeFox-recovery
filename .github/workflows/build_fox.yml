name: Build OrangeFox Recovery for vivo X300 Pro

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build OrangeFox (Android 16)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Device Tree
        uses: actions/checkout@v4
        with:
          path: device_tree

      - name: Free Disk Space & Setup Swap
        run: |
          sudo swapoff -a || true
          sudo rm -f /swapfile
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/share/swift
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker system prune -a --volumes -f || true
          sudo fallocate -l 16G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=16384
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          sudo sysctl -w vm.swappiness=15
          sudo sysctl -w vm.vfs_cache_pressure=100
          free -h
          df -h

      - name: Setup Build Environment & Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib \
            gcc-multilib git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev \
            lib32z1-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev \
            libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc \
            yasm zip zlib1g-dev python3 python3-pip

      - name: Install Google Repo Tool
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+rx ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Initialize OrangeFox Source Tree (fox_16.0)
        run: |
          mkdir -p ~/OrangeFox
          cd ~/OrangeFox
          git config --global user.name "Builder"
          git config --global user.email "builder@github.com"
          git config --global http.postBuffer 1048576000
          git config --global http.lowSpeedLimit 1000
          git config --global http.lowSpeedTime 60
          repo init -u https://gitlab.com/OrangeFox/Manifest.git -b fox_16.0 --depth=1
          repo sync -c -j4 --no-clone-bundle --no-tags || \
            (echo "Retrying sync with lower concurrency..." && sleep 5 && repo sync -c -j2 --no-clone-bundle --no-tags) || \
            (echo "Final sync retry..." && sleep 5 && repo sync -c -j1 --no-clone-bundle --no-tags)

      - name: Setup vivo X300 Pro Device Tree
        run: |
          mkdir -p ~/OrangeFox/device/vivo
          cp -r $GITHUB_WORKSPACE/device_tree ~/OrangeFox/device/vivo/PD2502
          rm -rf ~/OrangeFox/device/vivo/PD2502/.github
          rm -rf ~/OrangeFox/device/vivo/PD2502/.git

      - name: Patch Soong / Blueprint Memory Limits & Prebuilts
        run: |
          cd ~/OrangeFox
          # Set Go memory limit on soong_build without aggressive GC thrashing
          find build/blueprint -name "bootstrap.go" -exec sed -i 's/env -i /env -i GOMEMLIMIT=12GiB /g' {} + || true
          find build/soong -name "soong.go" -exec sed -i 's/env -i /env -i GOMEMLIMIT=12GiB /g' {} + || true
          # Allow 4KB prebuilt binaries (magiskboot) to bypass 16KB page-size verification
          find external -name "Android.bp" -exec sed -i '/name: "magiskboot"/a \    ignore_max_page_size: true,' {} + || true

      - name: Compile OrangeFox Recovery
        run: |
          cd ~/OrangeFox
          export FOX_BUILD_DEVICE="PD2502"
          export MALLOC_ARENA_MAX=1
          export _JAVA_OPTIONS="-Xmx4g"
          export GOMEMLIMIT=12GiB
          export BUILD_BROKEN_PREBUILT_ELF_FILES=true
          export PRODUCT_CHECK_PREBUILT_MAX_PAGE_SIZE=false
          export TARGET_NO_CHECK_ELF_FILES=true
          source build/envsetup.sh
          source device/vivo/PD2502/vendorsetup.sh
          lunch twrp_PD2502-bp2a-eng
          mka vendorbootimage recoveryimage -j$(nproc)

      - name: Upload Output Recovery Images
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-vivo-x300pro-PD2502
          path: |
            ~/OrangeFox/out/target/product/PD2502/*.img
            ~/OrangeFox/out/target/product/PD2502/OrangeFox-*.zip
            ~/OrangeFox/out/target/product/PD2502/ramdisk-recovery.cpio
